name: Homebrew

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published release version without the v prefix (for example 1.1.1)
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  update:
    name: Open Homebrew update PR
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 15
    concurrency:
      group: homebrew-update
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Propose the cask update and start its CI
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ inputs.version }}
        run: bash scripts/update-homebrew.sh
