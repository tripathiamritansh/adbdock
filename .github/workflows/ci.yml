name: CI and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  prepare:
    name: Release policy and tooling tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -B -m unittest discover -s Tests -p 'test_*.py' -v
      - name: Select version and release scope
        id: version
        run: python3 scripts/ci-version.py

  build:
    name: Build and test (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check host and scripts
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          xcrun swiftc --version
          python3 --version
          bash -n build.sh
          for script in scripts/*.sh hooks/pre-commit Tests/fixtures/*.sh; do
            bash -n "$script"
          done
      - name: Regression tests
        run: ./scripts/test-security.sh
      - name: Build and verify the native app
        run: |
          ./build.sh
          codesign --verify --deep --strict build/AdbDock.app
          python3 scripts/smoke-test.py
      - name: Verify Homebrew style
        if: matrix.arch == 'arm64'
        run: brew style Casks/adbdock.rb
      - name: Package and verify the DMG
        run: ./scripts/package-dmg.sh --skip-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 7

  ci:
    name: CI
    if: always()
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every test and architecture
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$PREPARE_RESULT" = success && test "$BUILD_RESULT" = success

  publish:
    name: Publish release
    needs: [prepare, ci]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: build/release
      - name: Publish verified artifacts from this run
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/publish-release.py build/release

  homebrew:
    name: Open Homebrew update PR
    needs: [prepare, publish]
    uses: ./.github/workflows/homebrew.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
